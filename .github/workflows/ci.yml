name: Verificar aplicação
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha-apenas-do-banco-de-ci
          MYSQL_DATABASE: autoescola_test
          MYSQL_USER: autoescola
          MYSQL_PASSWORD: senha-apenas-de-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psenha-apenas-do-banco-de-ci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/autoescola_test
      TEST_DATABASE_USERNAME: autoescola
      TEST_DATABASE_PASSWORD: senha-apenas-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./mvnw -B verify
      - run: node --test frontend/tests/*.mjs
