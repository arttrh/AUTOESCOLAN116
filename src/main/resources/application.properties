spring.application.name=AutoEscolaN116
server.port=${PORT:8080}
server.shutdown=graceful
spring.datasource.url=${DATABASE_URL:jdbc:${DB_VENDOR:mysql}://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:autoescolan116}}
spring.datasource.username=${DATABASE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQL_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=3
api.security.token.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5521,http://localhost:5521}
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${NOTIFICATIONS_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
