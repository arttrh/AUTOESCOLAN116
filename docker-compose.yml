services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autoescolan116}
      MYSQL_USER: ${MYSQL_USER:-autoescola}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-autoescolan116}
      DATABASE_USERNAME: ${MYSQL_USER:-autoescola}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Preencha JWT_SECRET no .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Preencha ADMIN_PASSWORD no .env}
      NOTIFICATIONS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
